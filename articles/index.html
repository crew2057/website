<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabi Prajapati</title>
    <link rel="stylesheet" href="../dist/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-slate-900 dark:text-gray-200 transition-colors duration-300 antialiased font-sans">
    <nav class="fixed w-full z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-gray-200 dark:border-slate-800 transition-colors duration-300">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0 font-bold text-xl tracking-tight text-brand-900 dark:text-brand-100">
                    <a href="/"><i class="fa-solid fa-shield-halved mr-2 text-brand-500"></i>Rabi <span class="text-brand-500">Prajapati</span></a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8" id="desktop-nav">
                        <a href="/" data-target="page-home" class="nav-link hover:text-brand-500 dark:hover:text-brand-500 transition-colors px-3 py-2 rounded-md text-sm font-medium cursor-pointer">Home</a>
                        <a href="./" data-target="page-articles" class="nav-link text-brand-500 dark:text-brand-500 transition-colors px-3 py-2 rounded-md text-sm font-bold cursor-pointer">Articles</a>
                        <a href="../resources/" data-target="page-resources" class="nav-link hover:text-brand-500 dark:hover:text-brand-500 transition-colors px-3 py-2 rounded-md text-sm font-medium cursor-pointer">Resources</a>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="theme-toggle" title="Toggle Dark Mode" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-slate-800 transition-colors focus:outline-none flex items-center justify-center w-10 h-10">
                        <i id="theme-toggle-dark-icon" class="fa-solid fa-moon text-gray-600 dark:text-gray-300 hidden text-lg"></i>
                        <i id="theme-toggle-light-icon" class="fa-solid fa-sun text-gray-600 dark:text-gray-300 hidden text-lg"></i>
                    </button>
                    <div class="md:hidden">
                        <button id="mobile-menu-btn" class="p-2 rounded-md text-gray-500 hover:bg-gray-200 dark:hover:bg-slate-800 focus:outline-none flex items-center justify-center w-10 h-10">
                            <i class="fa-solid fa-bars text-xl"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-slate-800">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3" id="mobile-nav">
                <a href="/" data-target="page-home" class="nav-link block px-3 py-2 rounded-md text-base font-medium hover:bg-gray-100 dark:hover:bg-slate-800 cursor-pointer">Home</a>
                <a href="./" data-target="page-articles" class="nav-link block px-3 py-2 rounded-md text-base font-bold text-brand-500 bg-brand-50 dark:bg-slate-800 cursor-pointer">Articles</a>
                <a href="../resources/" data-target="page-resources" class="nav-link block px-3 py-2 rounded-md text-base font-medium hover:bg-gray-100 dark:hover:bg-slate-800 cursor-pointer">Resources</a>
            </div>
        </div>
    </nav>
      <main id="page-articles" class="page-section active pt-32 pb-16 min-h-[calc(100vh-130px)] md:min-h-[calc(100vh-90px)] bg-gray-50 dark:bg-slate-900 transition-colors">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="mb-12 reveal active">
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-4">Articles & Projects</h2>
                <div class="w-16 h-1 bg-brand-500 rounded mb-8"></div>
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-gray-200 dark:border-slate-700">
                    <div class="flex flex-wrap gap-2" id="article-type-filters">
                        <button class="px-4 py-2 rounded-md text-sm font-medium bg-brand-500 text-white transition-colors filter-btn" data-filter="all">All</button>
                        <button class="px-4 py-2 rounded-md text-sm font-medium bg-gray-100 dark:bg-slate-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-slate-600 transition-colors filter-btn" data-filter="project">Projects</button>
                        <button class="px-4 py-2 rounded-md text-sm font-medium bg-gray-100 dark:bg-slate-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-slate-600 transition-colors filter-btn" data-filter="writeup">Writeups</button>
                    </div>
                    <div class="flex flex-wrap gap-4 w-full lg:w-auto">
                        <select id="article-tag-select" class="flex-1 lg:w-48 px-4 py-2 rounded-md text-sm font-medium bg-gray-50 dark:bg-slate-900 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                            <option value="all">All Tags</option>
                        </select>
                        <select id="article-sort" class="flex-1 lg:w-40 px-4 py-2 rounded-md text-sm font-medium bg-gray-50 dark:bg-slate-900 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                        </select>
                    </div>
                </div>
            </div>
            <!-- Dynamically add articles -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="articles-grid"></div>
            <div id="articles-pagination" class="flex justify-center mt-12 gap-2 reveal active"></div>
        </div>
    </main>
          <footer class="bg-gray-100 dark:bg-slate-950 py-8 border-t border-gray-200 dark:border-slate-800 transition-colors">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
            <div class="text-gray-500 dark:text-gray-400 text-sm mb-4 md:mb-0">
                &copy; <span id="year"></span> Rabi Prajapati. All rights reserved.
            </div>
            <div class="flex space-x-6">
                <a href="https://www.linkedin.com/in/rabi-pjpt" class="text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors">
                    <span class="sr-only">LinkedIn</span>
                    <i class="fa-brands fa-linkedin text-xl"></i>
                </a>
                <a href="https://github.com/crew2057/" class="text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors">
                    <span class="sr-only">GitHub</span>
                    <i class="fa-brands fa-github text-xl"></i>
                </a>
            </div>
        </div>
    </footer>
            <!-- Back to Top Button -->
    <button id="back-to-top" class="fixed bottom-20 right-6 w-12 h-12 bg-brand-500 text-white rounded-full shadow-lg flex items-center justify-center opacity-0 translate-y-4 invisible transition-all duration-300 z-50 hover:bg-brand-600 hover:shadow-xl focus:outline-none" aria-label="Back to top">
        <i class="fa-solid fa-arrow-up"></i>
    </button>
    <script src="../js/script.js"></script>
</body>
</html>
